# A real Windows machine for a maintainer's hands-on test: dispatch it, then SSH in with the command in the run's
# "SSH:" annotation. upterm, since tmate's public servers are gone (mxschmitt/action-tmate#255).
# Only the dispatching user's GitHub SSH keys can connect. `exit` in the session, or the 60-minute cap, ends the job.
name: Windows live
on: workflow_dispatch
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_OAUTH_TOKEN: ${{ secrets.OPTCHAT_TEST_ANTHROPIC_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install -g @earendil-works/pi-coding-agent@1.1.0
      - id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
          detached: true
          wait-timeout-minutes: 15
      # The API serves a job's log only after it ends, so the command goes out as an annotation, readable while it runs.
      - run: echo "::notice title=SSH::${{ steps.upterm.outputs.ssh-command }}"
        shell: bash
